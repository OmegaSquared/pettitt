<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
        /* Theme Variables */
        :root {
            --svg-text-color: #333333;
            --svg-bg-color: #ffffff;
            --svg-accent-blue: #3B719F;
            --svg-accent-orange: #D36B2C;
            --svg-arrow-color: #3B719F;
            --svg-loop-bg: #f5f5f5;
        }

        /* Dark Mode Override (applied when parent context is dark) */
        @media (prefers-color-scheme: dark) {
            :root {
                --svg-text-color: #e0e0e0;
                --svg-bg-color: #1a1a1a;
                --svg-loop-bg: #2a2a2a;
            }
        }
        
        /* Check for class on body if embedded inline */
        body.dark-mode svg {
             --svg-text-color: #e0e0e0;
             --svg-bg-color: transparent;
             --svg-loop-bg: #2a2a2a;
        }
        
        .title { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: var(--svg-text-color); text-anchor: middle; }
        .subtitle { font-family: sans-serif; font-size: 18px; fill: var(--svg-text-color); text-anchor: middle; }
        .label { font-family: sans-serif; font-size: 12px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
        .list-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: var(--svg-text-color); }
        .list-item { font-family: sans-serif; font-size: 12px; fill: var(--svg-text-color); }

        /* Paths */
        .loop-path-blue { fill: none; stroke: var(--svg-accent-blue); stroke-width: 40; stroke-linecap: round; opacity: 0.9; }
        .loop-path-orange { fill: none; stroke: var(--svg-accent-orange); stroke-width: 40; stroke-linecap: round; opacity: 0.9; }
        
        /* Quadrants */
        .quadrant { transition: opacity 0.3s; cursor: pointer; }
        .quadrant:hover { opacity: 0.8; }
        .q-blue { fill: var(--svg-accent-blue); }
        .q-orange { fill: var(--svg-accent-orange); }
        .q-gray { fill: #999999; }
        .q-dark-gray { fill: #666666; }

        /* Arrows */
        .arrow { fill: var(--svg-accent-blue); animation: pulse 2s infinite; }
        .arrow-orange { fill: var(--svg-accent-orange); animation: pulse 2s infinite reverse; }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); transform-origin: center; }
            100% { opacity: 0.6; transform: scale(1); }
        }
    </style>

    <!-- Main Title -->
    <text x="400" y="40" class="title">Economic Growth Feedback Loop</text>
    <text x="280" y="80" class="subtitle">Expansion</text>
    <text x="520" y="80" class="subtitle">Contraction</text>

    <!-- Infinity Loop Structure -->
    <g transform="translate(400, 220)">
        <!-- Left Loop (Blue) -->
        <path d="M-10,0 C-10,-80 -130,-80 -130,0 C-130,80 -10,80 -10,0" class="loop-path-blue" />
        
        <!-- Right Loop (Blue/Orange Mix) -->
        <path d="M10,0 C10,80 130,80 130,0 C130,-80 10,-80 10,0" class="loop-path-blue" stroke-dasharray="290" stroke-dashoffset="0" />
        <path d="M10,0 C10,80 130,80 130,0 C130,-80 10,-80 10,0" class="loop-path-orange" stroke-dasharray="145" stroke-dashoffset="145" />
    </g>

    <!-- Left Quadrants (Expansion) -->
    <g transform="translate(270, 220)">
        <circle cx="0" cy="0" r="60" fill="white" />
        <!-- Top Left: Income (Gray) -->
        <path d="M0,0 L-55,-10 A56,56 0 0,1 -10,-55 Z" class="quadrant q-gray" transform="rotate(-45)"/>
        <text x="-25" y="-15" class="label">Income</text>
        
        <!-- Top Right: Consumption (Blue) -->
        <path d="M0,0 L10,-55 A56,56 0 0,1 55,-10 Z" class="quadrant q-blue" transform="rotate(-45)"/>
         <text x="25" y="-15" class="label" style="font-size: 10px">Consumption</text>

        <!-- Bottom Right: Production (Orange) -->
        <path d="M0,0 L55,10 A56,56 0 0,1 10,55 Z" class="quadrant q-orange" transform="rotate(-45)"/>
        <text x="25" y="15" class="label">Production</text>

        <!-- Bottom Left: Employment (Dark Gray) -->
        <path d="M0,0 L-10,55 A56,56 0 0,1 -55,10 Z" class="quadrant q-dark-gray" transform="rotate(-45)"/>
        <text x="-25" y="15" class="label" style="font-size: 8px">Employment</text>
    </g>

    <!-- Right Quadrants (Contraction) -->
    <g transform="translate(530, 220)">
        <circle cx="0" cy="0" r="60" fill="white" />
        <!-- Top Left: Income (Gray) -->
         <path d="M0,0 L-55,-10 A56,56 0 0,1 -10,-55 Z" class="quadrant q-gray" transform="rotate(-45)"/>
        <text x="-25" y="-15" class="label">Income</text>
        
        <!-- Top Right: Consumption (Blue) -->
        <path d="M0,0 L10,-55 A56,56 0 0,1 55,-10 Z" class="quadrant q-blue" transform="rotate(-45)"/>
        <text x="25" y="-15" class="label" style="font-size: 10px">Consumption</text>

        <!-- Bottom Right: Production (Orange) -->
        <path d="M0,0 L55,10 A56,56 0 0,1 10,55 Z" class="quadrant q-orange" transform="rotate(-45)"/>
        <text x="25" y="15" class="label">Production</text>

        <!-- Bottom Left: Employment (Dark Gray) -->
        <path d="M0,0 L-10,55 A56,56 0 0,1 -55,10 Z" class="quadrant q-dark-gray" transform="rotate(-45)"/>
        <text x="-25" y="15" class="label" style="font-size: 8px">Employment</text>
    </g>

    <!-- Directional Arrows -->
    <!-- Left Loop Arrow -->
    <path d="M220,180 L230,170 L230,190 Z" class="arrow" transform="rotate(-45 225 180)"/>
    
    <!-- Right Loop Arrow -->
    <path d="M580,260 L570,270 L590,270 Z" class="arrow-orange" transform="rotate(-45 580 265)"/>

    <!-- Left Text Column -->
    <g transform="translate(20, 120)">
        <text x="0" y="0" class="list-title">Positive Feedback Loop</text>
        <text x="0" y="25" class="list-item">• Higher Income → Higher Consumption</text>
        <text x="0" y="45" class="list-item">• Higher Consumption → Higher Production</text>
        <text x="0" y="65" class="list-item">• Higher Production → Higher Employment</text>
        <text x="0" y="85" class="list-item">• Higher Employment → Higher Income</text>
    </g>

    <!-- Right Text Column -->
    <g transform="translate(600, 120)">
        <text x="0" y="0" class="list-title">Negative Feedback Loop</text>
        <text x="0" y="25" class="list-item">• Lower Income → Lower Consumption</text>
        <text x="0" y="45" class="list-item">• Lower Consumption → Lower Production</text>
        <text x="0" y="65" class="list-item">• Lower Production → Lower Employment</text>
        <text x="0" y="85" class="list-item">• Lower Employment → Lower Income</text>
    </g>
    
    <!-- Inflection Point -->
    <line x1="400" y1="260" x2="400" y2="340" stroke="#999" stroke-dasharray="4"/>
    <text x="400" y="360" class="subtitle">Inflection Point</text>
</svg>
